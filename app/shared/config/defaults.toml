[analysis]
mode = "fast"
max_hypotheses = 3
max_tool_calls = 8
max_critic_cycles = 0
minimum_sample_size = 20

[performance]
timeout_seconds = 120
parallel_tools = false

[llm]
provider = "disabled"
temperature = 0.0
max_retries = 2

[evaluation]
repetitions = 3

[persistence]
database_url = "sqlite:///:memory:"
postgres_sslmode = "require"

[data_intake]
identifier_name_tokens = ["id", "identifier", "uuid", "identificador", "nº"]
identifier_unique_ratio = 0.95
identifier_max_length = 128
categorical_max_unique = 20
categorical_unique_ratio = 0.1
categorical_max_length = 64
temporal_parse_ratio = 1.0
temporal_formats = ["%Y-%m-%d", "%Y-%m-%dT%H:%M:%S", "%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S%z", "%d/%m/%Y"]
text_name_tokens = ["description", "comment", "notes", "descripcion", "comentario"]

[uploads]
# Zero disables the application-level dataset upload size limit.
max_dataset_bytes = 0
max_dictionary_bytes = 1048576
chunk_size_bytes = 65536

[deployment]
environment = "development"
cors_allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
allow_local_analysis = true
rate_limit_window_seconds = 60
max_upload_requests = 20
max_exploration_requests = 60
max_report_requests = 120
max_concurrent_operations = 2
max_tracked_clients = 1000

[eda]
significance_level = 0.05
top_relationships = 10
max_pairs = 1000
max_categories = 50
max_cached_datasets = 8
top_categories = 10
max_histogram_bins = 30
outlier_iqr_multiplier = 1.5
outlier_mad_threshold = 3.5
max_outlier_examples = 20
normality_alpha = 0.05
mutual_information_neighbors = 3
# kNN mutual information samples complete pairs beyond this many rows.
mutual_information_max_rows = 10000
max_scatter_points = 2000
max_box_outliers = 200
# Upper bound for grouped_summary; larger groups are shown first, the rest are reported as omitted.
max_summary_groups = 20
# Conservative K-Means limits for the deployed exploration endpoint.
kmeans_max_rows = 3000
kmeans_max_plot_points = 200
kmeans_silhouette_max_rows = 300
kmeans_n_init = 10
kmeans_max_iter = 100
random_seed = 0
